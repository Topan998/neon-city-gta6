<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Neon City — Saltwater Vice</title>
    <meta
      name="description"
      content="An open-world crime game in a neon-lit coastal city. Traffic, pedestrians, five stars of heat, three jobs and a beach. Runs offline in a browser."
    />
    <style>
      :root {
        color-scheme: dark;
        --ink: #eaf2fb;
        --dim: rgba(214, 232, 250, 0.55);
        --hot: #ff3d81;
        --cool: #31e6ff;
        --panel: rgba(8, 12, 18, 0.62);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #05070a;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      canvas#scene { display: block; width: 100vw; height: 100vh; outline: none; }

      /* ---- The HUD lives in plain DOM above the canvas: cheap, crisp and easy to stage. ---- */
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
      #hud.hidden { display: none; }

      .panel {
        position: absolute; background: var(--panel);
        border: 1px solid rgba(160, 200, 240, 0.14);
        border-radius: 9px; padding: 9px 12px;
        backdrop-filter: blur(6px);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
      }

      #cash { left: 26px; top: 22px; min-width: 148px; }
      #cash .label { font-size: 9px; letter-spacing: 2.4px; color: var(--dim); text-transform: uppercase; }
      #cash .value {
        font: 700 27px/1.05 "Helvetica Neue", Helvetica, Arial, sans-serif;
        letter-spacing: -0.5px; font-variant-numeric: tabular-nums;
      }
      #cash .value .cents { font-size: 16px; color: rgba(180, 230, 190, 0.85); }
      #cash .job { font-size: 10.5px; letter-spacing: 1.2px; color: var(--dim); margin-top: 3px; text-transform: uppercase; }

      #stars { left: 26px; top: 96px; display: flex; gap: 4px; }
      #stars span {
        display: block; width: 19px; height: 19px; opacity: 0.16;
        transition: opacity 160ms linear, transform 160ms ease-out;
        color: #ffd45e; font-size: 19px; line-height: 19px;
      }
      #stars span.lit { opacity: 1; transform: scale(1.06); text-shadow: 0 0 12px rgba(255, 190, 60, 0.95); }

      #condition { left: 26px; bottom: 26px; width: 208px; }
      #condition .row { display: flex; justify-content: space-between; font-size: 9.5px; letter-spacing: 1.6px; color: var(--dim); text-transform: uppercase; }
      #condition .bar { height: 5px; margin-top: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      #condition .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #43e08a, #b9e84a); transition: width 140ms linear, background 300ms; }
      #condition .bar.low i { background: linear-gradient(90deg, #ff5a4a, #ff9c3a); }

      #speedo { right: 26px; bottom: 26px; text-align: right; min-width: 132px; }
      #speedo .kmh { font: 700 34px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
      #speedo .kmh small { font-size: 11px; letter-spacing: 2px; color: var(--dim); margin-left: 4px; }
      #speedo .gear { font-size: 10px; letter-spacing: 2.4px; color: var(--dim); margin-top: 2px; }
      #speedo .gear b { color: var(--cool); }

      #minimap-wrap { right: 22px; top: 22px; padding: 7px; border-radius: 12px; }
      #minimap { display: block; width: 176px; height: 176px; border-radius: 7px; }
      #minimap-wrap .ring {
        position: absolute; inset: 5px; border-radius: 9px; pointer-events: none;
        box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.7);
      }
      #minimap-wrap .compass {
        position: absolute; left: 12px; top: 10px; font-size: 9px; letter-spacing: 1px;
        color: rgba(190, 225, 250, 0.6);
      }

      #banner {
        position: absolute; left: 50%; top: 15%; transform: translate(-50%, -8px);
        text-align: center; opacity: 0; transition: opacity 220ms ease-out, transform 220ms ease-out;
        max-width: 720px;
      }
      #banner.show { opacity: 1; transform: translate(-50%, 0); }
      #banner .who {
        display: inline-block; font-size: 10px; letter-spacing: 3.4px; text-transform: uppercase;
        color: #0b0f14; background: var(--cool); padding: 2px 9px; border-radius: 3px; font-weight: 700;
      }
      #banner .say {
        display: inline-block; margin-top: 7px; padding: 8px 16px; border-radius: 8px;
        background: rgba(6, 10, 15, 0.74); border: 1px solid rgba(160, 210, 245, 0.16);
        font: 500 17px/1.35 "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      #objective {
        position: absolute; left: 50%; top: 30px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 12px; padding: 7px 15px;
        border-radius: 7px; background: rgba(6, 10, 15, 0.6);
        border: 1px solid rgba(160, 210, 245, 0.14);
        font-size: 11px; letter-spacing: 1.7px; text-transform: uppercase; color: #d6e8fa;
        opacity: 0; transition: opacity 200ms;
      }
      #objective.show { opacity: 1; }
      #objective .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 10px var(--hot); }
      #objective .clock { font-variant-numeric: tabular-nums; color: #ffd45e; letter-spacing: 1px; }

      #hint {
        position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%);
        font-size: 11px; letter-spacing: 1.5px; color: rgba(220, 236, 250, 0.66);
        text-transform: uppercase; text-shadow: 0 1px 3px #000;
        background: rgba(5, 9, 14, 0.42); padding: 5px 13px; border-radius: 5px;
      }
      #hint b { color: #fff; }

      #toast {
        position: absolute; left: 50%; top: 58%; transform: translate(-50%, 0);
        font: 700 15px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 1px;
        color: #ffd45e; opacity: 0; transition: opacity 260ms;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
      }
      #toast.show { opacity: 1; }

      /* ---- Title and pause screens ---- */
      #start, #pause {
        position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at 40% 30%, rgba(6, 12, 20, 0.55), rgba(3, 6, 10, 0.94) 72%);
        text-align: center; padding: 32px;
      }
      #start.hidden, #pause.hidden { display: none; }
      #start h1 {
        font: 800 66px/0.94 "Helvetica Neue", Helvetica, Arial, sans-serif;
        letter-spacing: -2.5px; text-transform: uppercase;
        background: linear-gradient(180deg, #ffffff, #8fd8ff 55%, #ff5fa2);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 6px 30px rgba(80, 190, 255, 0.35));
      }
      #start .sub { font-size: 12px; letter-spacing: 5px; text-transform: uppercase; color: var(--dim); margin-top: -6px; }
      #start .keys { display: grid; grid-template-columns: repeat(2, minmax(0, 240px)); gap: 7px 26px; margin-top: 8px; font-size: 12px; color: #cfe4f6; }
      #start .keys div { display: flex; justify-content: space-between; gap: 14px; border-bottom: 1px solid rgba(150, 190, 225, 0.12); padding-bottom: 5px; }
      #start .keys b { color: #fff; font-weight: 600; letter-spacing: 1.2px; font-size: 11px; }
      #start .play {
        margin-top: 10px; font-size: 12px; letter-spacing: 3.4px; text-transform: uppercase;
        padding: 12px 26px; border-radius: 5px; border: 1px solid rgba(120, 220, 255, 0.5);
        color: #eaf8ff; background: rgba(30, 120, 160, 0.18);
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.72; } 50% { opacity: 1; } }
      #pause h2 { font-size: 26px; letter-spacing: 7px; text-transform: uppercase; font-weight: 700; }
      #pause .row { font-size: 12px; letter-spacing: 1.6px; color: var(--dim); }
      #pause .row b { color: #fff; }

      #boot-error {
        display: none; position: fixed; left: 20px; bottom: 20px; max-width: 720px; z-index: 60;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #ffb3a3; background: rgba(24, 8, 10, 0.94);
        border: 1px solid rgba(255, 120, 100, 0.4); padding: 12px 16px; border-radius: 8px;
        white-space: pre-wrap; max-height: 60vh; overflow: auto;
      }
      #boot-note {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        pointer-events: none; z-index: 5; font: 700 11px/1.6 "Helvetica Neue", Helvetica, Arial, sans-serif;
        letter-spacing: 5px; color: rgba(210, 232, 250, 0.45); text-transform: uppercase;
      }

      /* ---- Screenshot mode: pin the whole page to 1280x720 so a capture is stable. ---- */
      html.shot-mode, html.shot-mode body { width: 1280px; height: 720px; overflow: hidden; }
      html.shot-mode canvas#scene { width: 1280px; height: 720px; }
      html.shot-mode #hud, html.shot-mode #start, html.shot-mode #pause {
        position: fixed; inset: auto; left: 0; top: 0; width: 1280px; height: 720px;
      }
      html.shot-mode #boot-note { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="scene" tabindex="0"></canvas>
    <div id="boot-note">Building the city</div>

    <!-- The vendored three.js r160 build is a classic script; it defines the global THREE that
         every module under src/ reads. Only main.js is a module. -->
    <script src="./vendor/three.min.js"></script>
    <script>
      // Boot diagnostics: an exception in the module graph is shown on screen and lands in the
      // document title, which is what the screenshot harness reads when a render comes out blank.
      window.__bootErrors = [];
      function bootFail(msg) {
        window.__bootErrors.push(String(msg));
        var el = document.getElementById('boot-error');
        if (el) {
          el.style.display = 'block';
          el.textContent = window.__bootErrors.join('\n');
        }
        document.title = 'BOOT ERROR: ' + String(msg).slice(0, 120);
      }
      window.addEventListener('error', function (e) {
        bootFail((e && (e.message || (e.error && e.error.stack))) || 'error');
      });
      window.addEventListener('unhandledrejection', function (e) {
        bootFail((e && (e.reason && (e.reason.stack || e.reason.message))) || e.reason || 'rejection');
      });
    </script>
    <div id="boot-error"></div>
    <script type="module">
      import('./src/main.js').catch(function (err) {
        bootFail((err && (err.stack || err.message)) || err);
      });
    </script>
  </body>
</html>
