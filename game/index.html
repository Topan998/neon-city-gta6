<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Neon City — Saltwater Vice</title>
    <meta name="description" content="An open-world crime game in a rain-slick neon city. Three jobs, five stars, one city. Runs offline in the browser." />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #06080c; }
      canvas#scene { display: block; width: 100vw; height: 100vh; outline: none; cursor: crosshair; }
      #boot-error {
        display: none; position: fixed; left: 24px; bottom: 24px; max-width: 640px; z-index: 50;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #ffb3a3; background: rgba(20, 8, 10, 0.9); border: 1px solid rgba(255, 120, 100, 0.4);
        padding: 14px 18px; border-radius: 10px; white-space: pre-wrap;
      }
      #boot-note {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        pointer-events: none; z-index: 5;
        font: 700 12px/1.6 "Helvetica Neue", Helvetica, Arial, sans-serif;
        letter-spacing: 4px; color: rgba(220, 235, 250, 0.5);
      }
      /* The screenshot path pins the whole page to exactly 1280x720 so a capture is stable. */
      html.shot-mode, html.shot-mode body { width: 1280px; height: 720px; overflow: hidden; }
      html.shot-mode canvas#scene { width: 1280px; height: 720px; }
      html.shot-mode #hud, html.shot-mode #start, html.shot-mode #pause {
        width: 1280px; height: 720px; inset: auto; left: 0; top: 0;
      }
      html.shot-mode #boot-note { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="scene" tabindex="0"></canvas>
    <div id="boot-note">BUILDING THE CITY…</div>
    <div id="boot-error"></div>

    <!-- The vendored three.js build is a classic script: it puts THREE on the global before the
         module graph below runs. Everything else is a plain ES module under src/. -->
    <script src="./vendor/three.min.js"></script>
    <script>
      // Boot diagnostics: a failed module shows up in the title, which is what the smoke test reads.
      window.__bootErrors = [];
      window.addEventListener('error', (e) => {
        window.__bootErrors.push(String((e && (e.message || e.error)) || 'error'));
        document.title = 'BOOT ERROR: ' + (e && e.message ? e.message : 'unknown');
      });
      window.addEventListener('unhandledrejection', (e) => {
        window.__bootErrors.push(String(e.reason));
        document.title = 'BOOT REJECTION: ' + String(e.reason);
      });
    </script>
    <script type="module">
      import game from './src/main.js';
      const note = document.getElementById('boot-note');
      if (note && game) note.style.display = 'none';
    </script>
  </body>
</html>
