<!DOCTYPE html><html><body style="margin:0"><canvas id="c"></canvas>
<script src="vendor/three.min.js"></script>
<script>
const r = new THREE.WebGLRenderer({canvas: document.getElementById('c')});
r.setSize(800,450,false); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.1;
const s = new THREE.Scene(); s.background = new THREE.Color(0x203040);
const cam = new THREE.PerspectiveCamera(60, 800/450, 0.1, 2000); cam.position.set(-200, 3, 2); cam.lookAt(50, 3, 2);
const g = new THREE.Mesh(new THREE.PlaneGeometry(1200,1200), new THREE.MeshStandardMaterial({color:0x555555, roughness:0.9}));
g.rotation.x = -Math.PI/2; g.receiveShadow = true; s.add(g);
for (let i=0;i<4;i++){ const b = new THREE.Mesh(new THREE.BoxGeometry(6,20,6), new THREE.MeshStandardMaterial({color:0xcc8855}));
 b.position.set(-150+i*40, 10, -20); b.castShadow=true; b.receiveShadow=true; s.add(b); }
const d = new THREE.DirectionalLight(0xffddaa, 12); 
const dir = new THREE.Vector3(-0.94, 0.342, 0.0001).normalize();
const tgt = new THREE.Object3D(); tgt.position.set(0,0,0); s.add(tgt);
d.position.copy(tgt.position.clone().add(dir.multiplyScalar(340))); d.target = tgt; d.castShadow = true;
d.shadow.mapSize.set(2048,2048); d.shadow.camera.left=-120; d.shadow.camera.right=120; d.shadow.camera.top=120; d.shadow.camera.bottom=-120;
d.shadow.camera.near=1; d.shadow.camera.far=900; d.shadow.bias=-0.0005; d.shadow.normalBias=0.02; d.shadow.camera.updateProjectionMatrix();
s.add(d); s.add(new THREE.HemisphereLight(0x99bbff, 0x443322, 0.4));
r.render(s, cam);
document.title = 'TEST sm=' + (d.shadow.map ? d.shadow.map.width : 'none');
</script></body></html>
